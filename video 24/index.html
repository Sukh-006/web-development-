<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box{
            border: 2px solid black;
            outline: 3px dashed
             rgb(51, 190, 137);
            padding: 34px;
            box-shadow: -10px 10px 5px black;
            border-radius: 32px;

            outline-offset: 2px;
        } 
        .text-element { text-shadow: -17px 5px 2px #958599; }
    </style>
</head>
<body>
    <div class="box">
        i am a div
    </div>

    <p class="text-element">
        Lorem ipsum dolor sit amet consectetur, adipisicing elit. Ducimus asperiores exercitationem pariatur delectus odit libero error consequatur rerum rem vero quisquam, ex quasi!
    </p>
</body>
</html>
