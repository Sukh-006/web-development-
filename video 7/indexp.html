<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice form</title>
</head>
<body>
    <h1>Student registration</h1>
<form action="" method="post">
    <fieldset>
        <legend>Personal info</legend>
    <div>
        <label for="username">Name</label>
        <input type="text" name="username" id="username" placeholder="Enter your full name" autofocus required>
        
    </div>

    <div>
        <label for="mail">Email</label>
        <input type="email" name="email" id="mail" placeholder="Enter your email" required autocomplete="off">

    </div>

    <div>
        <label for="pw">Password</label>
        <input type="password" name="password" id="pw" placeholder="Enter your password" required minlength="6" maxlength="12">
    </div>

    <div>
        <h4>select gender</h4>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male"  value="male">
        <label for="female">Female</label>
        <input type="radio" name="gender" id="female"  value="female">
        <label for="other">Other</label>
        <input type="radio" name="gender" id="other" value="other" checked>
    </div>

    <div>
        <h4>Select skills</h4>
        <input type="checkbox" name="skills" id="html" value="html" checked>
        <label for="html">HTML</label>
        <input type="checkbox" name="skills" id="css" value="css">
        <label for="css">CSS</label>
        <input type="checkbox" name="skills" id="js" value="js">
        <label for="js">JavaScript</label>
    </div>

    <div>
        <h4>Select course level </h4>
        <select name="level" id="level">
            <option value="beg" >Begineer</option>
            <option value="int" selected>Intermediate</option>
            <option value="ad">Advanced</option>
        </select>
        <label for="level">select your level</label>
    </div>

    <div>
        <label for="linked">Addditinal Comments</label>
        <textarea name="comments" id="linked" placeholder="Write your message" rows="4"></textarea>
        <button type="submit">Submit</button>
    </div>
    </fieldset>
</form>
    
</body>
</html>
