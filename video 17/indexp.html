<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            background-color: lightblue;
        }
        #green{
            background-color: green;
        }
        article p{
            color: white;
            background-color: black;
        }
        main p:first-of-type{
            color: red;
        }
        a:link{
            color: blue;
        }
        a:hover{
            background-color: orange;
        }
    </style>
    

    
</head>
<body>
    <div>
        i am div
    </div>

    <div id="green">
        i am green div
    </div>

    <article>
        <p>i am p inside an article</p>
    </article>

    <main>
        <p>i am first p inside main</p>
        <p>i am second p inside main</p>
    </main>

    <a href="www.google.com">Go to Goggle</a>
    <a href="www.facebook.com">Go to Facebook</a>
</body>
</html>
