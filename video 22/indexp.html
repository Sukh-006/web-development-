<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            width: 10vh;
            background-color: black;
            color: white;
            border-width: 2px;
            border-color: orange;
        }

        .container {
            width: 80vw;
            /* screen width ka 80% */
            margin: 20px auto;
            background-color: lightblue;
            padding: 20px;

            h1 {
                font-size: 2rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        navbar
    </div>

    <div class="container">
        <h1>Heading</h1>
        <p>This is paragraph</p>

    </div>
</body>

</html>
