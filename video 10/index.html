<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>audio and videos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div>
        <video width="500" controls muted loop poster="bg.jpeg" preload="auto">
            <source src="video2.mp4" type="video/mp4">
            this video is nor available
        </video>
    </div>
    <div>
        <audio controls autoplay loop muted preload="none">
            <source src="audio1.mp3" type="audio/mp3" >
            Your browser does not support the audio tag.
        </audio>
    </div>
    <div>
        <iframe src="https://example.com" width="600" height="400"></iframe>
    </div>
    <div>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/BHACKCNDMW8?si=Je6pjOd1u1vqLbz6" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen autoplay></iframe>
    </div>
    <div>

        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2624.991441025255!2d2.291906375464517!3d48.85837360070898!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e66ffb3bc1e179%3A0x18e02bce41212e0f!2sMacaron%20Bar!5e0!3m2!1sen!2sin!4v1772460660618!5m2!1sen!2sin"  style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

</html>
